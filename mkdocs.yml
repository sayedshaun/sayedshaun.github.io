site_name: Md Abu Sayed
site_url: https://sayedshaun.github.io/
site_author: Md Abu Sayed
site_description: AI/ML Engineer building LLM systems, low-resource Bangla NLP, and production ML infrastructure.

repo_url: https://github.com/sayedshaun
edit_uri: ''

# A hand-written single-page theme — no Material, no plugins. All the design
# lives in theme/main.html + theme/assets/style.css; all the content lives in
# docs/_content/*.md, which docs/index.md stitches together.
theme:
  name: null
  custom_dir: theme

plugins: []

markdown_extensions:
  - attr_list
  - md_in_html
  - smarty
  - footnotes
  - toc:
      permalink: false
  - pymdownx.snippets:
      base_path: ['docs/_content']
      check_paths: true

# Section files are includes, not pages of their own.
exclude_docs: |
  _content/

extra:
  profile:
    name: Md Abu Sayed
    role: AI / ML Engineer
    email: sayedshaun4@gmail.com
    github: https://github.com/sayedshaun
    linkedin: https://linkedin.com/in/sayed-shaun
    scholar: https://youtu.be/3pcfiUQfCoA
