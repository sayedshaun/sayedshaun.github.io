site_name: Sayed Shaun
site_url: https://sayedshaun.github.io/
site_author: Sayed Shaun
site_description: AI/ML engineer building LLM systems, agentic AI, and production machine-learning infrastructure.

theme:
  name: material
  language: en
  logo: images/profile.jpg
  favicon: images/profile.jpg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - assets/css/theme.css

plugins:
  - search
  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      post_date_format: long
      archive: false
      categories: true
      pagination_per_page: 10

nav:
  - Home: index.md
  - Experience: about_me/work_exp.md
  - Education: about_me/education.md
  - Skills: about_me/skills.md
  - Research: research/research.md
  - Projects: software/projects.md
  - Certifications: about_me/certifications.md
  - Blog: blog/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sayedshaun
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/sayed-shaun
      name: LinkedIn
    - icon: simple/huggingface
      link: https://huggingface.co/SayedShaun
      name: Hugging Face
    - icon: simple/leetcode
      link: https://leetcode.com/u/Sayed_Shaun/
      name: LeetCode
    - icon: simple/kaggle
      link: https://www.kaggle.com/sayedshaun
      name: Kaggle
    - icon: fontawesome/solid/envelope
      link: mailto:sayedshaun4@gmail.com
      name: Email
  generator: false
