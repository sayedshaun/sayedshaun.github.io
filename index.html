<!DOCTYPE html>
<!--
  ─────────────────────────────────────────────────────────────
  You never need to edit this file. Edit README.md instead.
  This page reads README.md and renders it. That's the whole site.
  ─────────────────────────────────────────────────────────────
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Md Abu Sayed — AI / ML Engineer</title>
<meta name="description" content="Md Abu Sayed — AI/ML Engineer building LLM systems, NLP tooling, and scalable ML infrastructure.">
<style>
  :root{
    --bg:#ffffff; --bg-soft:#f6f7f8; --line:#e4e7ea;
    --fg:#14181c; --fg-dim:#4a5560; --fg-faint:#8a949e;
    --accent:#0f7a5c; --accent-dim:#a8d5c9;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.7 var(--sans);
  }
  ::selection{background:var(--accent); color:var(--bg)}

  /* ---------- nav (auto-built from the ## headings) ---------- */
  nav{
    position:sticky; top:0; z-index:10;
    backdrop-filter:blur(10px);
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  nav .inner{
    max-width:820px; margin:0 auto; padding:0 24px;
    display:flex; align-items:center; gap:20px;
    height:52px; overflow-x:auto; scrollbar-width:none;
  }
  nav .inner::-webkit-scrollbar{display:none}
  nav a{
    font:500 12.5px/1 var(--mono); letter-spacing:.06em; text-transform:lowercase;
    color:var(--fg-dim); text-decoration:none; white-space:nowrap; padding:4px 0;
  }
  nav a:hover{color:var(--accent)}
  nav a.home{color:var(--accent); font-weight:600; margin-right:auto; text-transform:none}

  /* ---------- layout ---------- */
  main{max-width:820px; margin:0 auto; padding:56px 24px 96px}
  #doc>*:first-child{margin-top:0}

  h1{
    font-size:clamp(2.1rem,6vw,3rem); line-height:1.1; letter-spacing:-.02em;
    margin:0 0 .35em; font-weight:700;
  }
  h2{
    font:600 12.5px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); margin:64px 0 24px; scroll-margin-top:72px;
  }
  h2::before{content:"// "; color:var(--fg-faint)}
  h3{font-size:1.12rem; line-height:1.4; margin:36px 0 .3em; font-weight:650; letter-spacing:-.01em}
  h3+p{margin-top:0}
  p{margin:0 0 1.1em}
  a{color:var(--fg); text-decoration:none; border-bottom:1px solid var(--accent-dim)}
  a:hover{color:var(--accent); border-color:var(--accent)}
  hr{border:0; border-top:1px solid var(--line); margin:56px 0 0}
  hr+h2{margin-top:56px}
  ul,ol{margin:0 0 1.1em; padding-left:1.1em}
  li{margin:.35em 0; color:var(--fg-dim)}
  li::marker{color:var(--fg-faint)}
  li strong{color:var(--fg)}
  strong{font-weight:650}
  blockquote{
    margin:0 0 1.1em; padding:2px 0 2px 18px;
    border-left:2px solid var(--accent-dim); color:var(--fg-dim);
  }
  code{
    font:400 .855em/1.5 var(--mono);
    background:var(--bg-soft); border:1px solid var(--line);
    border-radius:5px; padding:.15em .45em; color:var(--fg-dim);
  }
  pre{
    background:var(--bg-soft); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; overflow-x:auto; margin:0 0 1.3em;
  }
  pre code{background:none; border:0; padding:0; font-size:.85rem; color:var(--fg)}
  img{max-width:100%; height:auto; border-radius:10px}
  table{border-collapse:collapse; width:100%; margin:0 0 1.3em; font-size:.94rem; display:block; overflow-x:auto}
  th,td{border:1px solid var(--line); padding:8px 12px; text-align:left}
  th{background:var(--bg-soft); font-weight:600}

  /* ---------- auto-detected flourishes (no markup needed) ---------- */
  /* a lone image = round avatar */
  p.avatar{margin:0 0 1.6em}
  p.avatar img{
    width:104px; height:104px; border-radius:50%; object-fit:cover;
    border:1px solid var(--line); display:block;
  }
  /* a paragraph starting with `code` right under a heading = date / meta line */
  p.meta{
    font:400 12.5px/1.6 var(--mono); color:var(--fg-faint);
    letter-spacing:.02em; margin:0 0 .9em;
  }
  p.meta code{background:none; border:0; padding:0; color:var(--accent); font-size:1em}
  /* a paragraph that is nothing but `code` spans = tag chips */
  p.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:1.3em}
  p.chips code{padding:.4em .75em; border-radius:100px; font-size:.8rem; color:var(--fg)}
  /* a paragraph that is nothing but links = button row */
  p.links{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:0}
  p.links a{
    border:1px solid var(--line); border-radius:8px; padding:.45em .9em;
    font:500 13px/1.4 var(--mono); color:var(--fg-dim); background:var(--bg-soft);
  }
  p.links a:hover{border-color:var(--accent); color:var(--accent)}
  /* the tagline directly under the title */
  h1+p{font-size:1.02rem; color:var(--fg-dim); margin-bottom:1.6em}
  h1+p strong{color:var(--fg)}

  footer{
    max-width:820px; margin:0 auto; padding:0 24px 56px;
    font:400 12px/1.6 var(--mono); color:var(--fg-faint);
  }
  #err{color:#ff7b72; font-family:var(--mono); font-size:14px}
  @media (max-width:600px){
    main{padding:40px 20px 72px}
    nav .inner{padding:0 20px}
    h2{margin-top:52px}
  }
</style>
</head>
<body>

<nav><div class="inner" id="nav"></div></nav>
<main><div id="doc"><p id="err" hidden></p></div></main>
<footer id="foot"></footer>

<script>
/* ── a small, dependency-free markdown renderer ───────────────────────── */
var esc = function (s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
};

function inline(s) {
  // Stash code spans, images and links behind sentinels so the emphasis and
  // autolink passes below can never chew on their contents or attributes.
  var slot = [];
  function keep(html) { return '' + (slot.push(html) - 1) + ''; }

  s = s.replace(/`([^`]+)`/g, function (_, c) { return keep('<code>' + esc(c) + '</code>'); });
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, function (_, alt, src) {
    return keep('<img src="' + src + '" alt="' + alt + '" loading="lazy">');
  });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, function (_, text, href) {
    var ext = /^(https?:)?\/\//.test(href) ? ' target="_blank" rel="noopener"' : '';
    return keep('<a href="' + href + '"' + ext + '>' + text + '</a>');
  });
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, function (_, pre, url) {
    return pre + keep('<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>');
  });
  s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^_\w])_([^_\n]+)_/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return s.replace(/(\d+)/g, function (_, i) { return slot[+i]; });
}

// A line matching this ends the paragraph / list-item currently being gathered.
var BREAK = /^(\s*$|#{1,6}\s|```|\s*>|\s*([-*+]|\d+\.)\s|\s*(-{3,}|\*{3,}|_{3,})\s*$|\s*\|)/;
var BULLET = /^(\s*)([-*+]|\d+\.)\s+(.*)$/;

function render(src) {
  var lines = src.replace(/\r\n/g, '\n').replace(/^---\n[\s\S]*?\n---\n/, '').split('\n');
  var out = [], headings = [], i = 0, prevWasHeading = false;

  while (i < lines.length) {
    var l = lines[i];

    if (/^\s*$/.test(l)) { i++; continue; }

    if (/^\s*```/.test(l)) {                                   // fenced code
      var buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
      prevWasHeading = false; continue;
    }

    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) {               // horizontal rule
      out.push('<hr>'); i++; prevWasHeading = false; continue;
    }

    var h = l.match(/^(#{1,6})\s+(.*?)\s*#*$/);                 // heading
    if (h) {
      var lvl = h[1].length;
      var id = h[2].replace(/[`*_\[\]()]/g, '').trim().toLowerCase()
                   .replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
      if (lvl === 2) headings.push({ id: id, text: h[2] });
      out.push('<h' + lvl + ' id="' + id + '">' + inline(h[2]) + '</h' + lvl + '>');
      i++; prevWasHeading = true; continue;
    }

    if (/^\s*>/.test(l)) {                                      // blockquote
      var q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push('<blockquote>' + render(q.join('\n')).html + '</blockquote>');
      prevWasHeading = false; continue;
    }

    if (BULLET.test(l)) {                                       // list
      var ordered = /^\s*\d+\./.test(l), items = [];
      while (i < lines.length && BULLET.test(lines[i])) {
        var text = lines[i++].match(BULLET)[3];
        while (i < lines.length && !BREAK.test(lines[i])) text += ' ' + lines[i++].trim();
        items.push('<li>' + inline(text) + '</li>');
      }
      var tag = ordered ? 'ol' : 'ul';
      out.push('<' + tag + '>' + items.join('') + '</' + tag + '>');
      prevWasHeading = false; continue;
    }

    if (/^\s*\|/.test(l) && /^\s*\|?[\s:|-]+\|/.test(lines[i + 1] || '')) {   // table
      var cells = function (row) {
        return row.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); });
      };
      var head = cells(lines[i]); i += 2;
      var rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push('<table><thead><tr>' +
        head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        rows.map(function (r) {
          return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
        }).join('') +
        '</tbody></table>');
      prevWasHeading = false; continue;
    }

    var para = [lines[i++]];                                    // paragraph
    while (i < lines.length && !BREAK.test(lines[i])) para.push(lines[i++]);
    var raw = para.join('\n').trim();
    var cls = '';
    if (/^!\[[^\]]*\]\([^)]+\)$/.test(raw)) cls = 'avatar';
    else if (!raw.replace(/`[^`]*`|[\s·,|]/g, '')) cls = 'chips';
    else if (!raw.replace(/\[[^\]]+\]\([^)]+\)|[\s·|,•\/-]/g, '')) cls = 'links';
    else if (prevWasHeading && /^`/.test(raw)) cls = 'meta';
    out.push('<p' + (cls ? ' class="' + cls + '"' : '') + '>' + inline(raw) + '</p>');
    prevWasHeading = false;
  }

  return { html: out.join('\n'), headings: headings };
}

/* ── boot: load README.md, render it, build the nav ───────────────────── */
fetch('README.md?v=' + Date.now())
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function (src) {
    var result = render(src);
    var doc = document.getElementById('doc');
    doc.innerHTML = result.html;

    var nav = document.getElementById('nav');
    var h1 = doc.querySelector('h1');
    if (h1) {
      var name = h1.textContent.trim();
      var tagline = doc.querySelector('h1 + p');
      document.title = name + (tagline ? ' — ' + tagline.textContent.split('·')[0].trim() : '');
      document.getElementById('foot').textContent =
        '© ' + new Date().getFullYear() + ' ' + name;
      var home = document.createElement('a');
      home.className = 'home'; home.href = '#'; home.textContent = name;
      nav.appendChild(home);
    }
    result.headings.forEach(function (hd) {
      var a = document.createElement('a');
      a.href = '#' + hd.id; a.textContent = hd.text;
      nav.appendChild(a);
    });
  })
  .catch(function () {
    var e = document.getElementById('err');
    e.hidden = false;
    e.textContent = 'Could not load README.md — serve this folder over http '
      + '(e.g. `python3 -m http.server`) rather than opening the file directly.';
  });
</script>
</body>
</html>
