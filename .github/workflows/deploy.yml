name: Deploy site

# Every push to main (direct or via a merged PR) rebuilds and publishes the site.
on:
  push:
    branches: [main]
  # refresh the résumé from Overleaf even on days with no pushes
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      # Pulls the current PDF from the Overleaf share link. Falls back to the
      # committed copy if Overleaf is unreachable, so a deploy never fails on it.
      - name: Fetch résumé from Overleaf
        env:
          OVERLEAF_READ_URL: ${{ secrets.OVERLEAF_READ_URL }}
        run: python3 scripts/fetch_resume.py

      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
