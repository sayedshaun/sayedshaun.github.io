name: Deploy site

# Every push to main (direct or via a merged PR) rebuilds and publishes the site.
on:
  push:
    branches: [main]
  # refresh the résumé from the resume.latex repo even on days with no pushes
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      # Pulls the current PDF from the resume.latex repo. Falls back to the
      # committed copy if GitHub is unreachable, so a deploy never fails on it.
      - name: Fetch résumé from resume.latex
        run: python3 scripts/fetch_resume.py

      - run: mkdocs build --strict

      # The homepage is a static file, not an mkdocs page — mkdocs only
      # builds /blog here. Drop it in as site/index.html after the build so
      # it doesn't get overwritten.
      - name: Use onepage/index.html as the site root
        run: cp onepage/index.html site/index.html

      # Point the résumé button at files/resume.pdf?v=<content hash> so a new
      # résumé gets a new URL and returning visitors stop being served the
      # copy their browser cached.
      - name: Cache-bust the résumé link
        run: |
          hash=$(md5sum site/files/resume.pdf | cut -c1-8)
          sed -i "s|files/resume\.pdf?v=dev|files/resume.pdf?v=$hash|g" site/index.html
          grep -o 'files/resume\.pdf?v=[a-z0-9]*' site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
